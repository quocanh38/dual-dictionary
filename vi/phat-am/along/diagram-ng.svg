<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>/ŋ/ as in sing, long</title>
<rect width="480" height="480" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
<!-- header -->
<text x="240" y="38" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#0f766e" letter-spacing="0.08em">BACK OF TONGUE RAISED</text>
<text x="240" y="58" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#6b7280">/ŋ/ as in sing, long</text>
<!-- mouth outline side view -->
<rect x="48" y="84" width="384" height="284" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
<!-- head profile hint -->
<path d="M 72 112 Q 72 88 108 84 Q 140 84 162 108 L 162 280 Q 120 320 72 280 Q 72 180 72 112 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
<!-- nasal cavity -->
<path d="M 108 112 Q 132 112 148 128 Q 155 142 148 158" fill="none" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
<text x="118" y="102" font-family="Inter,sans-serif" font-size="7" fill="#9ca3af">Nasal cavity</text>
<!-- palate -->
<path d="M 108 128 Q 155 125 195 132 Q 248 142 268 165" fill="none" stroke="#d1d5db" stroke-width="1.4"/>
<text x="198" y="122" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="600" fill="#6b7280">Palate</text>
<!-- upper teeth -->
<rect x="248" y="158" width="42" height="16" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="252" y="162" width="34" height="8" rx="1.5" fill="#f3f4f6"/>
<text x="269" y="152" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="700" fill="#374151">Upper Teeth</text>
<!-- lower teeth -->
<rect x="248" y="236" width="42" height="16" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="252" y="240" width="34" height="8" rx="1.5" fill="#f3f4f6"/>
<text x="269" y="270" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="700" fill="#374151">Lower Teeth</text>
<!-- tongue -->
<path d="M 130 170 Q 160 165 200 142 Q 235 118 268 122 L 275 155 Q 210 182 130 170 Z" fill="#0f766e" opacity="0.92" stroke="#115e59" stroke-width="1"/>
<text x="188" y="202" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" font-weight="700" fill="white">Back of Tongue Raised</text>
<!-- lips -->
<ellipse cx="312" cy="201" rx="42" ry="27" fill="none" stroke="#d1d5db" stroke-width="1.4"/>
<path d="M 272 198 Q 312 188 352 198" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round"/>
<path d="M 272 218.8 Q 312 228.8 352 218.8" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round"/>
<!-- airflow hint without arrow: wavy lines -->
<g opacity="0.45" stroke="#0f766e" stroke-width="1.2" fill="none" stroke-linecap="round">
  <path d="M 330 197 Q 350 195 370 197"/>
  <path d="M 332 205 Q 352 203 372 205"/>
  <path d="M 330 213 Q 350 211 370 213"/>
</g>
<text x="350" y="241" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" fill="#0f766e" letter-spacing="0.06em">Gentle Airflow</text>
<!-- bottom labels -->
<rect x="48" y="384" width="384" height="1" fill="#e5e7eb"/>
<text x="240" y="408" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#374151" font-weight="600">Soft Palate Closed / Back Tongue Raised / Air Through Nose / Lower Teeth</text>
<text x="240" y="428" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#6b7280">Example: <tspan font-weight="700" fill="#0f766e">along /əˈlɔŋ/</tspan> · English labels inside image</text>
<text x="240" y="458" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" fill="#9ca3af">Cross-section mouth diagram — no arrows — for pronunciation practice</text>
</svg>