<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>/aɪ/ as in my, time</title>
<rect width="480" height="480" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
<!-- header -->
<text x="240" y="38" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#0f766e" letter-spacing="0.08em">WIDE OPEN TO HIGH</text>
<text x="240" y="58" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#6b7280">/aɪ/ as in my, time</text>
<!-- mouth outline side view -->
<rect x="48" y="84" width="384" height="284" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
<!-- head profile hint -->
<path d="M 72 112 Q 72 88 108 84 Q 140 84 162 108 L 162 280 Q 120 320 72 280 Q 72 180 72 112 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
<!-- nasal cavity -->
<path d="M 108 112 Q 132 112 148 128 Q 155 142 148 158" fill="none" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
<text x="118" y="102" font-family="Inter,sans-serif" font-size="7" fill="#9ca3af">Nasal cavity</text>
<!-- palate -->
<path d="M 108 128 Q 155 125 195 132 Q 248 142 268 165" fill="none" stroke="#d1d5db" stroke-width="1.4"/>
<text x="198" y="122" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="600" fill="#6b7280">Palate</text>
<!-- upper teeth -->
<rect x="248" y="158" width="42" height="16" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="252" y="162" width="34" height="8" rx="1.5" fill="#f3f4f6"/>
<text x="269" y="152" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="700" fill="#374151">Upper Teeth</text>
<!-- lower teeth -->
<rect x="248" y="256" width="42" height="16" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
<rect x="252" y="260" width="34" height="8" rx="1.5" fill="#f3f4f6"/>
<text x="269" y="290" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="700" fill="#374151">Lower Teeth</text>
<!-- tongue -->
<path d="M 130 195 Q 160 145 215 125 Q 255 118 275 135 L 275 168 Q 185 205 130 195 Z" fill="#0f766e" opacity="0.92" stroke="#115e59" stroke-width="1"/>
<text x="188" y="202" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" font-weight="700" fill="white">Wide Open to High</text>
<!-- lips -->
<ellipse cx="312" cy="211" rx="42" ry="37" fill="none" stroke="#d1d5db" stroke-width="1.4"/>
<path d="M 272 204.66666666666666 Q 312 194.66666666666666 352 204.66666666666666" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round"/>
<path d="M 272 230.8 Q 312 240.8 352 230.8" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round"/>
<!-- airflow hint without arrow: wavy lines -->
<g opacity="0.45" stroke="#0f766e" stroke-width="1.2" fill="none" stroke-linecap="round">
  <path d="M 330 207 Q 350 205 370 207"/>
  <path d="M 332 215 Q 352 213 372 215"/>
  <path d="M 330 223 Q 350 221 370 223"/>
</g>
<text x="350" y="251" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" fill="#0f766e" letter-spacing="0.06em">Gentle Airflow</text>
<!-- bottom labels -->
<rect x="48" y="384" width="384" height="1" fill="#e5e7eb"/>
<text x="240" y="408" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#374151" font-weight="600">Open Jaw / Tongue Low to High / Strong Glide / Teeth Apart</text>
<text x="240" y="428" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#6b7280">Example: <tspan font-weight="700" fill="#0f766e">sign /saɪn/</tspan> · English labels inside image</text>
<text x="240" y="458" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" fill="#9ca3af">Cross-section mouth diagram — no arrows — for pronunciation practice</text>
</svg>