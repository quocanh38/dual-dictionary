<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="Offline pipeline: prepare where connected, learn where the network drops">
  <rect x="8" y="30" width="180" height="160" rx="14" fill="#eefaf7" stroke="#0f766e" stroke-width="2"/>
  <text x="98" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">1 · Chuẩn bị</text>
  <text x="98" y="86" text-anchor="middle" font-size="13" fill="#334155">Nơi có mạng</text>
  <text x="98" y="108" text-anchor="middle" font-size="13" fill="#334155">Studio + Meta draft</text>
  <text x="98" y="130" text-anchor="middle" font-size="13" fill="#334155">Review → pack ~10 KB</text>
  <text x="98" y="152" text-anchor="middle" font-size="13" fill="#334155">Cài 1 lần · USB/file</text>
  <rect x="230" y="30" width="180" height="160" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="320" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">2 · Mạng rớt</text>
  <text x="320" y="86" text-anchor="middle" font-size="13" fill="#334155">Ca đêm · công trường</text>
  <text x="320" y="108" text-anchor="middle" font-size="13" fill="#334155">Xe đường dài · tầng hầm</text>
  <text x="320" y="130" text-anchor="middle" font-size="13" fill="#334155">Airplane mode: vẫn học</text>
  <text x="320" y="152" text-anchor="middle" font-size="13" fill="#334155">Không key · không tracking</text>
  <rect x="452" y="30" width="180" height="160" rx="14" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/>
  <text x="542" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">3 · Học thật</text>
  <text x="542" y="86" text-anchor="middle" font-size="13" fill="#334155">Đọc → cụm → tình huống</text>
  <text x="542" y="108" text-anchor="middle" font-size="13" fill="#334155">IELTS/TOEIC key cố định</text>
  <text x="542" y="130" text-anchor="middle" font-size="13" fill="#334155">Lưu Vault → review FSRS</text>
  <text x="542" y="152" text-anchor="middle" font-size="13" fill="#334155">33 packs · 612 KB</text>
  <text x="209" y="120" font-size="22" fill="#64748b">→</text>
  <text x="431" y="120" font-size="22" fill="#64748b">→</text>
</svg>
