<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Lưu một nghĩa cụ thể thành thẻ ôn</title><desc id="desc">Sơ đồ bốn bước: chạm từ trong Reader, chọn nghĩa và nguồn từ điển, giữ định nghĩa cùng câu nguồn, rồi ôn đúng thẻ đã lưu. Một từ có thể có nhiều thẻ nghĩa.</desc><rect width="1200" height="675" rx="28" fill="#f2f7f6"/><text x="56" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#142a2a">Từ đang đọc → thẻ ôn đúng nghĩa</text><text x="56" y="112" font-family="Arial,sans-serif" font-size="20" fill="#506363">Sơ đồ minh họa luồng lưu nghĩa trong app</text>
<g font-family="Arial,sans-serif"><rect x="42" y="165" width="250" height="330" rx="20" fill="#fff" stroke="#c9d9d6" stroke-width="2"/><circle cx="78" cy="207" r="22" fill="#0f766e"/><text x="78" y="215" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1</text><text x="64" y="257" font-size="23" font-weight="700" fill="#142a2a">Trong Reader</text><text x="64" y="302" font-size="19" fill="#384d4d">The policy may</text><rect x="61" y="316" width="142" height="36" rx="8" fill="#c8f2e7"/><text x="72" y="341" font-size="19" font-weight="700" fill="#075e56">benefit from</text><text x="64" y="394" font-size="17" fill="#506363">Chạm cụm để tra</text><text x="64" y="424" font-size="17" fill="#506363">và lưu cùng câu gốc.</text>
<rect x="338" y="165" width="250" height="330" rx="20" fill="#fff" stroke="#c9d9d6" stroke-width="2"/><circle cx="374" cy="207" r="22" fill="#0f766e"/><text x="374" y="215" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">2</text><text x="360" y="257" font-size="23" font-weight="700" fill="#142a2a">Chọn nghĩa</text><rect x="360" y="280" width="204" height="50" rx="9" fill="#eef4f3"/><text x="374" y="311" font-size="17" fill="#263b3b">WordNet · verb</text><rect x="360" y="342" width="204" height="50" rx="9" fill="#c8f2e7" stroke="#0f766e"/><text x="374" y="373" font-size="17" font-weight="700" fill="#075e56">EN–VI · nghĩa 2 ✓</text><text x="360" y="433" font-size="17" fill="#506363">Có thể sửa định nghĩa.</text>
<rect x="634" y="165" width="250" height="330" rx="20" fill="#fff" stroke="#c9d9d6" stroke-width="2"/><circle cx="670" cy="207" r="22" fill="#0f766e"/><text x="670" y="215" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">3</text><text x="656" y="257" font-size="23" font-weight="700" fill="#142a2a">Giữ đủ ngữ cảnh</text><text x="656" y="302" font-size="18" font-weight="700" fill="#263b3b">Nghĩa cần ghi nhớ</text><text x="656" y="331" font-size="17" fill="#506363">to get an advantage</text><text x="656" y="380" font-size="17" font-weight="700" fill="#263b3b">Câu nguồn</text><text x="656" y="410" font-size="16" fill="#506363">The policy may benefit</text><text x="656" y="435" font-size="16" fill="#506363">from earlier investment.</text>
<rect x="930" y="165" width="228" height="330" rx="20" fill="#fff" stroke="#c9d9d6" stroke-width="2"/><circle cx="966" cy="207" r="22" fill="#0f766e"/><text x="966" y="215" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">4</text><text x="952" y="257" font-size="23" font-weight="700" fill="#142a2a">Ôn đúng thẻ</text><rect x="952" y="280" width="184" height="112" rx="12" fill="#eef4f3"/><text x="970" y="311" font-size="17" fill="#506363">Câu gốc + nghĩa</text><text x="970" y="341" font-size="17" font-weight="700" fill="#263b3b">benefit from</text><text x="970" y="371" font-size="16" fill="#506363">nguồn đã lưu</text><text x="952" y="435" font-size="17" fill="#506363">Review không tra lại</text><text x="952" y="461" font-size="17" fill="#506363">nghĩa đầu tiên.</text>
<path d="M300 330h28m-10-10 10 10-10 10M596 330h28m-10-10 10 10-10 10M892 330h28m-10-10 10 10-10 10" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="42" y="533" width="1116" height="92" rx="16" fill="#dff2ed"/><text x="68" y="571" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#075e56">Một từ có thể có nhiều thẻ nghĩa riêng.</text><text x="68" y="603" font-family="Arial,sans-serif" font-size="18" fill="#315b57">Mỗi thẻ giữ định nghĩa đầy đủ, nguồn từ điển và câu gốc để ôn lại đúng điều bạn đã chọn.</text></svg>
