<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Chọn mốc vốn từ trước khi xem độ phủ Reader</title><desc id="desc">Sơ đồ cho thấy người học chọn mốc vốn từ top 1k, 2k, 5k hoặc 10k; nếu chưa chọn thì Reader hiện chưa đủ thông tin thay vì 0 phần trăm. Khi có mốc, độ phủ được ước tính cục bộ và không phải điểm trình độ.</desc><rect width="1200" height="675" rx="28" fill="#f2f7f6"/><text x="56" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#142a2a">Reader: chọn mốc trước khi xem độ phủ</text><text x="56" y="112" font-family="Arial,sans-serif" font-size="20" fill="#506363">Độ phủ là ước tính trên thiết bị, không phải điểm trình độ.</text>
<rect x="56" y="155" width="1088" height="105" rx="18" fill="#fff" stroke="#c9d9d6" stroke-width="2"/><text x="82" y="194" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#263b3b">1 · Chọn vốn từ bạn đã biết</text><g font-family="Arial,sans-serif" font-size="19" font-weight="700"><rect x="82" y="210" width="138" height="34" rx="17" fill="#c8f2e7" stroke="#0f766e"/><text x="151" y="233" text-anchor="middle" fill="#075e56">Top 1k</text><rect x="236" y="210" width="138" height="34" rx="17" fill="#eef4f3"/><text x="305" y="233" text-anchor="middle" fill="#334b4b">Top 2k</text><rect x="390" y="210" width="138" height="34" rx="17" fill="#eef4f3"/><text x="459" y="233" text-anchor="middle" fill="#334b4b">Top 5k</text><rect x="544" y="210" width="138" height="34" rx="17" fill="#eef4f3"/><text x="613" y="233" text-anchor="middle" fill="#334b4b">Top 10k</text></g>
<path d="M600 274v40M600 314H319v26M600 314h281v26" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/><path d="m310 332 9 12 9-12m544 0 9 12 9-12" fill="none" stroke="#0f766e" stroke-width="4"/>
<rect x="56" y="362" width="510" height="190" rx="20" fill="#fff" stroke="#d7b87c" stroke-width="2"/><rect x="56" y="362" width="510" height="50" rx="20" fill="#fff3da"/><text x="82" y="395" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#765116">Chưa chọn mốc</text><text x="82" y="454" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#263b3b">Chưa đủ thông tin</text><text x="82" y="492" font-family="Arial,sans-serif" font-size="18" fill="#506363">Không hiển thị 0% và không gắn nhãn</text><text x="82" y="520" font-family="Arial,sans-serif" font-size="18" fill="#506363">“bài khó” khi chưa có baseline.</text>
<rect x="634" y="362" width="510" height="190" rx="20" fill="#fff" stroke="#79b9a7" stroke-width="2"/><rect x="634" y="362" width="510" height="50" rx="20" fill="#dff2ed"/><text x="660" y="395" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#075e56">Đã chọn mốc</text><text x="660" y="454" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#263b3b">Ví dụ: độ phủ 82%</text><rect x="660" y="472" width="428" height="20" rx="10" fill="#e5eeec"/><rect x="660" y="472" width="350" height="20" rx="10" fill="#0f766e"/><text x="660" y="526" font-family="Arial,sans-serif" font-size="18" fill="#506363">Ước tính cục bộ để tham khảo khi chọn bài.</text>
<rect x="56" y="582" width="1088" height="54" rx="14" fill="#e8eef5"/><text x="82" y="617" font-family="Arial,sans-serif" font-size="18" fill="#405367">Mốc này không thêm từ vào Vault và có thể được đổi trong Reader.</text></svg>
