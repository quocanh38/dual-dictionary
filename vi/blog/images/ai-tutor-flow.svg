<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">AI Tutor: từ bài đọc tới tình huống mới</title><desc id="desc">Sơ đồ AI Tutor: chọn một cụm có câu nguồn, đọc nội dung gửi và chi phí rồi đồng ý; trả lời tình huống, xem góp ý có trích dẫn; chấp nhận hoặc từ chối rồi mới lưu. Luồng AI cần mạng và key riêng, bản ghi âm không gửi.</desc><rect width="1200" height="675" rx="28" fill="#f2f7f6"/><text x="56" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#142a2a">AI Tutor: luyện cụm trong tình huống mới</text><text x="56" y="112" font-family="Arial,sans-serif" font-size="20" fill="#506363">Tùy chọn online · API key riêng · đồng ý trước mỗi yêu cầu</text>
