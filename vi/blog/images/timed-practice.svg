<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Chọn kỹ năng và bộ luyện có bấm giờ</title><desc id="desc">Sơ đồ cho biết Practice có feedback từng câu, Timed practice dùng bộ câu hỏi hiện có và cho chuyển câu, quay lại, bỏ qua, nộp bài. Số lượng hiện tại là IELTS Listening 7 trên 40, Reading 8 trên 40, TOEIC Listening và Reading mỗi phần 8 trên 100; đây không phải section đủ.</desc><rect width="1200" height="675" rx="28" fill="#f2f7f6"/><text x="56" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#142a2a">Practice: chọn kỹ năng, rồi chọn chế độ</text><text x="56" y="112" font-family="Arial,sans-serif" font-size="20" fill="#506363">Đồng hồ Timed practice chạy theo số câu hiện có trong bộ mẫu.</text>
<rect x="54" y="153" width="1092" height="90" rx="18" fill="#fff" stroke="#c9d9d6" stroke-width="2"/><text x="80" y="187" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#263b3b">1 · Chọn kỳ thi và kỹ năng</text><rect x="80" y="201" width="270" height="28" rx="8" fill="#e9f1ef"/><text x="96" y="221" font-family="Arial,sans-serif" font-size="15" fill="#334b4b">IELTS Academic / TOEIC L&amp;R</text><rect x="370" y="201" width="220" height="28" rx="8" fill="#e9f1ef"/><text x="386" y="221" font-family="Arial,sans-serif" font-size="15" fill="#334b4b">Listening / Reading</text><text x="650" y="219" font-family="Arial,sans-serif" font-size="17" fill="#506363">TOEIC Part 1 có audio mẫu offline.</text>
<rect x="54" y="267" width="510" height="144" rx="18" fill="#fff" stroke="#c9d9d6" stroke-width="2"/><text x="80" y="306" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#142a2a">Practice</text><text x="80" y="343" font-family="Arial,sans-serif" font-size="18" fill="#506363">Phản hồi sau mỗi câu.</text><text x="80" y="378" font-family="Arial,sans-serif" font-size="17" fill="#506363">Dừng và xem giải thích khi muốn.</text><rect x="590" y="267" width="556" height="144" rx="18" fill="#fff" stroke="#79b9a7" stroke-width="2"/><text x="616" y="306" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#075e56">Timed practice</text><text x="616" y="343" font-family="Arial,sans-serif" font-size="18" fill="#506363">Chuyển câu · quay lại · bỏ qua · nộp</text><text x="616" y="378" font-family="Arial,sans-serif" font-size="17" fill="#506363">Tải lại trang vẫn phục hồi phiên.</text>
<text x="56" y="459" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#263b3b">Bộ mẫu đang có</text><g font-family="Arial,sans-serif"><rect x="54" y="478" width="250" height="65" rx="12" fill="#e4f3ee"/><text x="72" y="506" font-size="17" font-weight="700" fill="#075e56">IELTS Listening</text><text x="72" y="530" font-size="16" fill="#315b57">7 / 40 câu</text><rect x="322" y="478" width="250" height="65" rx="12" fill="#e4f3ee"/><text x="340" y="506" font-size="17" font-weight="700" fill="#075e56">IELTS Reading</text><text x="340" y="530" font-size="16" fill="#315b57">8 / 40 câu</text><rect x="590" y="478" width="250" height="65" rx="12" fill="#eaf0f7"/><text x="608" y="506" font-size="17" font-weight="700" fill="#405367">TOEIC Listening</text><text x="608" y="530" font-size="16" fill="#506377">8 / 100 câu</text><rect x="858" y="478" width="288" height="65" rx="12" fill="#eaf0f7"/><text x="876" y="506" font-size="17" font-weight="700" fill="#405367">TOEIC Reading</text><text x="876" y="530" font-size="16" fill="#506377">8 / 100 câu</text></g><rect x="54" y="570" width="1092" height="62" rx="14" fill="#fff3da"/><text x="78" y="598" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#765116">Bộ khởi đầu, chưa phải section hoặc đề thi full-length.</text><text x="78" y="622" font-family="Arial,sans-serif" font-size="16" fill="#765116">App lưu số câu đúng thô để tự theo dõi; không quy đổi band IELTS hay scaled score TOEIC.</text></svg>
