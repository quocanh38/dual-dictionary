name: Test & IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      indexnow_full:
        description: 'Submit full sitemap to IndexNow (Bing / AI Search)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-main-checks
  cancel-in-progress: false

jobs:
  test-and-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run automated tests
        run: npm test

      - name: Run internal link check
        run: npm run qa:links

      - name: Notify IndexNow (Bing / AI Search)
        continue-on-error: true
        run: |
          sleep 15
          if [ "${{ inputs.indexnow_full }}" = "true" ]; then
            npm run seo:indexnow
          else
            npm run seo:indexnow:changed
          fi
