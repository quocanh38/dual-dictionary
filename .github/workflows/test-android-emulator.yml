name: Test Android APK on Real Emulator

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-android-emulator
  cancel-in-progress: true

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Build & Sign Test APK
        working-directory: android-twa
        run: |
          keytool -genkeypair -v \
            -keystore test.keystore \
            -alias hocta-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 365 \
            -storepass hocta123456 \
            -keypass hocta123456 \
            -dname "CN=HocTA Test, OU=QA, O=HocTA, L=Hanoi, ST=HN, C=VN"

          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks test.keystore \
            --ks-key-alias hocta-test \
            --ks-pass pass:hocta123456 \
            --key-pass pass:hocta123456 \
            --out hocta-android.apk \
            app-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" verify hocta-android.apk

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run APK tests on Real Android Emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -e
            mkdir -p emulator-screenshots

            echo "=== 1. Install hocta-android.apk ==="
            adb install -r android-twa/hocta-android.apk
            adb shell pm list packages | grep -q "package:app.hocta.twa"
            echo "PASS: Package app.hocta.twa installed"

            echo "=== 2. Verify ACTION_PROCESS_TEXT registration ==="
            adb shell cmd package query-activities -a android.intent.action.PROCESS_TEXT -t text/plain | grep -q "app.hocta.twa"
            echo "PASS: ProcessTextActivity registered for ACTION_PROCESS_TEXT"

            echo "=== 3. Verify QuickLookupWidgetProvider registration ==="
            adb shell dumpsys package app.hocta.twa | grep -q "QuickLookupWidgetProvider"
            echo "PASS: QuickLookupWidgetProvider registered"

            echo "=== 4. Clear logcat & Test LauncherActivity ==="
            adb logcat -c
            adb shell am start -W -n app.hocta.twa/.LauncherActivity
            sleep 6
            # Dismiss Chrome First-Run Experience ("Use without an account") on fresh emulator
            adb shell input tap 540 2080
            sleep 6
            adb shell am start -W -n app.hocta.twa/.LauncherActivity
            sleep 8
            adb exec-out screencap -p > emulator-screenshots/01-emulator-launch.png
            echo "PASS: LauncherActivity launched"

            echo "=== 5. Test ProcessTextActivity (short word -> ?q=affect) ==="
            adb shell am start -W -a android.intent.action.PROCESS_TEXT -t text/plain --es android.intent.extra.PROCESS_TEXT "affect" -n app.hocta.twa/.ProcessTextActivity
            sleep 8
            adb exec-out screencap -p > emulator-screenshots/02-emulator-process-text-word.png
            echo "PASS: ProcessTextActivity (word) launched"

            echo "=== 6. Test ProcessTextActivity (long sentence -> ?read=...) ==="
            adb shell am start -W -a android.intent.action.PROCESS_TEXT -t text/plain --es android.intent.extra.PROCESS_TEXT "Effective communication at work requires clear handovers between shifts." -n app.hocta.twa/.ProcessTextActivity
            sleep 8
            adb exec-out screencap -p > emulator-screenshots/03-emulator-process-text-reader.png
            echo "PASS: ProcessTextActivity (sentence -> Reader) launched"

            echo "=== 7. Test Widget deep-link (FSRS Review -> #/review) ==="
            adb shell am start -W -a android.intent.action.VIEW -d "https://hocta.app/index.html#/review" -n app.hocta.twa/.LauncherActivity
            sleep 8
            adb exec-out screencap -p > emulator-screenshots/04-emulator-widget-review.png
            echo "PASS: Widget deep-link (#/review) launched"

            echo "=== 8. Check logcat for FATAL crashes in app.hocta.twa ==="
            bash -c 'if adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime.*app\.hocta\.twa" | grep -A 5 "app.hocta.twa"; then echo "FAIL: Fatal crash detected!"; exit 1; else echo "PASS: Zero fatal crashes in logcat"; fi'
            ls -lh emulator-screenshots/

      - name: Upload Emulator Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-screenshots
          path: emulator-screenshots/
          retention-days: 14
